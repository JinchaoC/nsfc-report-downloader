[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nsfc-report-downloader"
version = "1.0.0"
description = "下载国家自然科学基金（kd.nsfc.cn）结题报告逐页图片并合成为 PDF（单文件，零第三方依赖）"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "JinchaoC" }]
keywords = ["nsfc", "国家自然科学基金", "结题报告", "pdf", "kd.nsfc.cn"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/JinchaoC/nsfc-report-downloader"

[project.scripts]
nsfc-report = "nsfc_report:main"

[tool.setuptools]
py-modules = ["nsfc_report"]
